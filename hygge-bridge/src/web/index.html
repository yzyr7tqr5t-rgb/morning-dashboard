<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verwarming">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<title>Verwarming</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f5f2;
    --card: #fcfcfb;
    --line: #e4e2dc;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7a7873;
    --series-1: #2a78d6;      /* temperatuur */
    --heat: #eb6834;          /* ketel aan */
    --heat-soft: #eb683426;
    --auto: #2a78d6;
    --ok: #1a7f37;
    --warn-bg: #fff4d6;
    --warn-text: #6b4d00;
    --btn: #ecebe6;
    --btn-active: #dddbd4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121211;
      --card: #1a1a19;
      --line: #2e2d2b;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8e86;
      --series-1: #3987e5;
      --heat: #d95926;
      --heat-soft: #d9592633;
      --auto: #3987e5;
      --ok: #3fb950;
      --warn-bg: #3a2f10;
      --warn-text: #f2d48a;
      --btn: #2a2a28;
      --btn-active: #363633;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --card: #1a1a19; --line: #2e2d2b;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --series-1: #3987e5; --heat: #d95926; --heat-soft: #d9592633; --auto: #3987e5; --ok: #3fb950;
    --warn-bg: #3a2f10; --warn-text: #f2d48a; --btn: #2a2a28; --btn-active: #363633;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 480px; margin: 0 auto; display: grid; gap: 12px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .conn { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .dot.on { background: var(--ok); }

  .banner {
    background: var(--warn-bg); color: var(--warn-text);
    border-radius: 12px; padding: 10px 12px; font-size: 14px;
  }
  .banner[hidden] { display: none; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }

  .now { text-align: center; padding: 22px 16px 18px; }
  .now .label { font-size: 14px; color: var(--text-secondary); }
  .now .temp { font-size: 64px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; margin: 6px 0 2px;
               font-variant-numeric: tabular-nums; }
  .now .temp small { font-size: 28px; font-weight: 500; color: var(--text-secondary); }
  .now .age { font-size: 13px; color: var(--text-muted); }

  .section-title { font-weight: 600; margin-bottom: 10px; }
  .hero { text-align: center; padding: 18px 16px 16px; }
  .hero .target { margin: 14px 0 4px; }
  .hero .target .num { font-size: 52px; letter-spacing: -0.02em; }
  .info { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
  .info-title { font-size: 14px; color: var(--text-secondary); }
  .info .sub { font-size: 12px; color: var(--text-muted); }
  .info-temp { font-size: 20px; font-weight: 500; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 15px;
    background: var(--btn); color: var(--text-primary);
  }
  .pill .swatch { width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); }
  .pill.manual .swatch { background: var(--heat); }
  .pill.auto .swatch { background: var(--auto); }
  .reason { margin-top: 8px; font-size: 13px; color: var(--text-secondary); min-height: 1.4em; }

  .target { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 8px; }
  .target .value { text-align: center; }
  .target .value .label { font-size: 14px; color: var(--text-secondary); }
  .target .value .num { font-size: 36px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .round {
    width: 64px; height: 64px; border-radius: 50%; border: 0;
    background: var(--btn); color: var(--text-primary);
    font-size: 32px; font-weight: 500; line-height: 1; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .round:active { background: var(--btn-active); }
  .round:disabled { opacity: 0.4; }
  .hint { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 8px; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row .title { font-weight: 600; }
  .row .sub { font-size: 13px; color: var(--text-secondary); }
  .switch { position: relative; width: 52px; height: 32px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
  .switch .track { position: absolute; inset: 0; border-radius: 999px; background: var(--btn-active); transition: background .2s; }
  .switch .knob { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
                  background: #fff; box-shadow: 0 1px 3px #0004; transition: transform .2s; }
  .switch input:checked + .track { background: var(--auto); }
  .switch input:checked + .track .knob { transform: translateX(20px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--series-1); outline-offset: 2px; }

  .chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .chart-head .title { font-weight: 600; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); flex-wrap: wrap; margin-bottom: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .key-line { width: 14px; height: 2px; background: var(--series-1); border-radius: 1px; }
  .key-target { width: 14px; border-top: 2px dashed var(--text-muted); }
  .key-setpoint { width: 14px; border-top: 2px dashed var(--heat); }
  .chart { position: relative; touch-action: pan-y; }
  .chart svg { display: block; width: 100%; height: 180px; overflow: visible; }
  .chart .empty { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--text-muted); }
  .chart .empty[hidden] { display: none; }
  .tip {
    position: absolute; top: 0; pointer-events: none; transform: translateX(-50%);
    background: var(--text-primary); color: var(--card); border-radius: 8px;
    padding: 4px 8px; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .tip[hidden] { display: none; }

  .foot { font-size: 12px; color: var(--text-muted); text-align: center; padding: 4px 0; }
  .error { color: #d1242f; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Verwarming</h1>
    <div class="conn"><span class="dot" id="dot"></span><span id="connText">verbinden…</span></div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="card hero" aria-live="polite">
    <div class="section-title">Hygge-thermostaat</div>
    <div class="pill" id="pill"><span class="swatch"></span><span id="pillText">Nog geen opdracht</span></div>
    <div class="target">
      <button class="round" id="minus" aria-label="Hygge 0,5 graden lager">−</button>
      <div class="value">
        <div class="num" id="target">– °C</div>
      </div>
      <button class="round" id="plus" aria-label="Hygge 0,5 graden hoger">+</button>
    </div>
    <div class="reason" id="reason"></div>
    <div class="hint">De Hygge regelt de ketel zelf, op zijn eigen thermometer.</div>
  </section>

  <section class="card">
    <div class="row">
      <div>
        <div class="title">Weekprogramma</div>
        <div class="sub">Hygge volgt zijn eigen programma uit de Seitron-app</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="schedule" role="switch" aria-label="Weekprogramma">
        <span class="track"><span class="knob"></span></span>
      </label>
    </div>
  </section>

  <section class="card">
    <div class="chart-head">
      <div class="title">Temperatuur</div>
      <div class="sub" id="range" style="font-size:12px;color:var(--text-muted)"></div>
    </div>
    <div class="legend">
      <span><i class="key-line"></i>Niko (ter info)</span>
      <span><i class="key-setpoint"></i>Ingesteld op Hygge</span>
    </div>
    <div class="chart" id="chart">
      <svg id="svg" role="img" aria-label="Temperatuurverloop"></svg>
      <div class="tip" id="tip" hidden></div>
      <div class="empty" id="empty">Nog te weinig metingen</div>
    </div>
  </section>

  <section class="card info">
    <div>
      <div class="info-title" id="sensorName">Niko</div>
      <div class="sub" id="age">nog geen meting</div>
    </div>
    <div class="info-temp" id="temp">– °C</div>
  </section>

  <div class="foot" id="foot"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n, d = 1) => n == null ? '–' : n.toLocaleString('nl-BE', { minimumFractionDigits: d, maximumFractionDigits: d });
const time = (t) => new Date(t).toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });

let status = null;
let pendingTarget = null;
let targetTimer = null;
let sending = false;
let errorText = '';

function showError(text) {
  errorText = text;
  if (status) render();
  setTimeout(() => { errorText = ''; if (status) render(); }, 6000);
}

async function api(path, body) {
  if (window.DEMO_API) return window.DEMO_API(path, body); // losse demo zonder bridge
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}

async function refresh() {
  try {
    status = await api('api/status');
    render();
  } catch {
    $('dot').className = 'dot';
    $('connText').textContent = 'bridge niet bereikbaar';
  }
}

function ago(t) {
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return `${s} s geleden`;
  const m = Math.round(s / 60);
  return m < 60 ? `${m} min geleden` : `${Math.round(m / 60)} u geleden`;
}

function render() {
  const { niko, hygge } = status;
  $('dot').className = niko.connected ? 'dot on' : 'dot';
  $('connText').textContent = niko.connected ? (status.demo ? 'demo' : 'verbonden met Niko') : 'geen verbinding met Niko';

  const banner = status.demo ? 'Demomodus: de Niko-temperatuur is gesimuleerd en er gaat niets naar de Hygge.'
    : status.dryRun ? 'Testmodus (DRY_RUN): er gaat niets naar de Hygge.' : '';
  $('banner').hidden = !banner;
  $('banner').textContent = banner;

  $('sensorName').textContent = `Niko · ${niko.sensorName}`;
  $('temp').textContent = `${fmt(niko.temperature)} °C`;
  $('age').textContent = `ter info · ${niko.lastReadingAt ? `gemeten ${ago(niko.lastReadingAt)}` : 'nog geen meting'}`;

  const [cls, text] = sending ? ['', 'Versturen…']
    : hygge.mode === 'manual' ? ['manual', `Manueel · ${fmt(hygge.setpoint)} °C`]
    : hygge.mode === 'auto' ? ['auto', 'Weekprogramma']
    : ['', 'Nog geen opdracht verstuurd'];
  $('pill').className = `pill ${cls}`;
  $('pillText').textContent = text;

  const last = hygge.last;
  let reason = '';
  if (last && last.ok) reason = `Verstuurd om ${time(last.at)}`;
  if (last && !last.ok) reason = `Niet gelukt om ${time(last.at)}: ${last.error}`;
  if (errorText) reason = errorText;
  $('reason').textContent = reason;
  $('reason').className = (last && !last.ok) || errorText ? 'reason error' : 'reason';

  const target = pendingTarget ?? hygge.setpoint;
  $('target').textContent = `${fmt(target)} °C`;
  $('target').style.opacity = hygge.mode === 'auto' && pendingTarget == null ? 0.45 : 1;
  $('minus').disabled = target <= hygge.bounds.min;
  $('plus').disabled = target >= hygge.bounds.max;

  $('schedule').checked = hygge.mode === 'auto';
  $('foot').textContent = `Bijgewerkt om ${new Date().toLocaleTimeString('nl-BE')}`;
  drawChart(status.history);
}

async function send(path, body, failText) {
  sending = true;
  render();
  try {
    status = await api(path, body);
  } catch (e) {
    showError(`${failText}: ${e.message}`);
  }
  sending = false;
  render();
}

function changeTarget(delta) {
  const { min, max } = status.hygge.bounds;
  const base = pendingTarget ?? status.hygge.setpoint;
  pendingTarget = Math.min(max, Math.max(min, base + delta));
  render();
  // even wachten zodat meerdere tikken samen één opdracht worden
  clearTimeout(targetTimer);
  targetTimer = setTimeout(async () => {
    const target = pendingTarget;
    await send('api/target', { target }, 'Kon temperatuur niet instellen');
    if (pendingTarget === target) pendingTarget = null;
    render();
  }, 1200);
}

$('minus').onclick = () => changeTarget(-0.5);
$('plus').onclick = () => changeTarget(0.5);
$('schedule').onchange = (e) => send('api/schedule', { schedule: e.target.checked }, 'Weekprogramma wijzigen lukt niet');

// --- Grafiek ------------------------------------------------------------------
let chartGeom = null;

function drawChart(history) {
  const svg = $('svg');
  const W = svg.clientWidth || 320, H = 180;
  const pad = { l: 34, r: 8, t: 10, b: 22 };
  const points = history.filter((p) => p[1] != null);
  $('empty').hidden = points.length >= 2;
  if (points.length < 2) { svg.innerHTML = ''; chartGeom = null; $('range').textContent = ''; return; }

  const t0 = points[0][0], t1 = points.at(-1)[0];
  const values = points.flatMap((p) => p[2] == null ? [p[1]] : [p[1], p[2]]);
  const lo = Math.floor(Math.min(...values) - 0.5), hi = Math.ceil(Math.max(...values) + 0.5);
  const x = (t) => pad.l + (t - t0) / Math.max(1, t1 - t0) * (W - pad.l - pad.r);
  const y = (v) => pad.t + (hi - v) / (hi - lo) * (H - pad.t - pad.b);

  const mins = Math.round((t1 - t0) / 60000);
  $('range').textContent = mins < 90 ? `laatste ${Math.max(1, mins)} min`
    : `laatste ${(Math.round(mins / 30) / 2).toLocaleString('nl-BE')} u`;

  let out = '';
  const step = hi - lo > 6 ? 2 : 1;
  for (let v = lo; v <= hi; v += step) {
    out += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    out += `<text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-muted)">${v}°</text>`;
  }
  // ingesteld op Hygge: trapjeslijn, onderbroken waar het weekprogramma actief was
  let sp = '';
  for (let i = 0; i < points.length; i++) {
    const v = points[i][2];
    if (v == null) continue;
    const prev = i > 0 ? points[i - 1][2] : null;
    sp += prev == null ? `M${x(points[i][0]).toFixed(1)},${y(v).toFixed(1)}` : `H${x(points[i][0]).toFixed(1)}V${y(v).toFixed(1)}`;
  }
  if (sp) out += `<path d="${sp}" fill="none" stroke="var(--heat)" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>`;
  // gemeten door Niko
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  out += `<path d="${d}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  out += `<text x="${pad.l}" y="${H - 4}" font-size="11" fill="var(--text-muted)">${time(t0)}</text>`;
  out += `<text x="${W - pad.r}" y="${H - 4}" text-anchor="end" font-size="11" fill="var(--text-muted)">${time(t1)}</text>`;
  out += `<line id="cross" x1="0" x2="0" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--text-secondary)" stroke-width="1" visibility="hidden"/>`;
  out += `<circle id="crossDot" r="4.5" fill="var(--series-1)" stroke="var(--card)" stroke-width="2" visibility="hidden"/>`;
  svg.innerHTML = out;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  chartGeom = { points, x, y };
}

function showTip(clientX) {
  if (!chartGeom) return;
  const rect = $('svg').getBoundingClientRect();
  const px = clientX - rect.left;
  const { points, x, y } = chartGeom;
  let best = 0;
  for (let i = 1; i < points.length; i++) if (Math.abs(x(points[i][0]) - px) < Math.abs(x(points[best][0]) - px)) best = i;
  const [t, v, setpoint] = points[best];
  const cx = x(t);
  const cross = $('cross'), dot = $('crossDot');
  cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
  dot.setAttribute('cx', cx); dot.setAttribute('cy', y(v)); dot.setAttribute('visibility', 'visible');
  const tip = $('tip');
  tip.hidden = false;
  tip.textContent = `${time(t)} · Niko ${fmt(v)} °C · Hygge ${setpoint == null ? 'weekprogr.' : fmt(setpoint) + ' °C'}`;
  tip.style.left = `${Math.min(rect.width - 110, Math.max(110, cx))}px`;
  tip.style.top = '-6px';
}

function hideTip() {
  $('tip').hidden = true;
  $('cross')?.setAttribute('visibility', 'hidden');
  $('crossDot')?.setAttribute('visibility', 'hidden');
}

const chartEl = $('chart');
chartEl.addEventListener('pointermove', (e) => showTip(e.clientX));
chartEl.addEventListener('pointerdown', (e) => showTip(e.clientX));
chartEl.addEventListener('pointerleave', hideTip);
window.addEventListener('resize', () => status && render());

refresh();
setInterval(refresh, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
