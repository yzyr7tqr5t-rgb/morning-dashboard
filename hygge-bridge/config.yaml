name: Verwarming (Hygge)
version: "1.0.0"
slug: hygge_bridge
description: Bedien de Seitron Hygge-thermostaat (via Hygge Way en IFTTT) en toon ter info de temperatuur van Niko Home Control.
url: https://github.com/yzyr7tqr5t-rgb/morning-dashboard/tree/claude/hygge-bridge/hygge-bridge
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:thermostat
panel_title: Verwarming
options:
  niko_host: ""
  niko_token: ""
  niko_sensor_name: ""
  ifttt_key: ""
  ifttt_event_set_temperature: hygge_set_temperature
  ifttt_event_auto: hygge_auto
  default_setpoint: 20
  min_setpoint: 10
  max_setpoint: 28
  dry_run: true
schema:
  niko_host: str
  niko_token: password
  niko_sensor_name: str
  niko_sensor_uuid: str?
  ifttt_key: password
  ifttt_event_set_temperature: str
  ifttt_event_auto: str
  default_setpoint: float(5,35)
  min_setpoint: float(5,35)
  max_setpoint: float(5,35)
  dry_run: bool
  demo: bool?
